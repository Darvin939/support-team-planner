<!DOCTYPE html>
<html lang="ru" data-theme="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<button id="themeToggle" class="login-theme-toggle" title="Светлая / тёмная тема" type="button">
    <span class="theme-icon-moon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 12.4A6.8 6.8 0 0 1 7.6 3.5a6.8 6.8 0 1 0 8.9 8.9Z"/></svg></span>
    <span class="theme-icon-sun"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="3.6"/><path d="M10 2.8v1.8M10 15.4v1.8M17.2 10h-1.8M4.6 10H2.8M14.9 5.1l-1.3 1.3M6.4 13.6l-1.3 1.3M14.9 14.9l-1.3-1.3M6.4 6.4 5.1 5.1"/></svg></span>
</button>
<div class="login-container">
    <div class="login-box">
        <div class="login-brand">
            <span class="login-brand-mark" aria-hidden="true">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="14" height="14" rx="3"/><path d="M3 8.5h14M8.2 3v14"/></svg>
            </span>
            <span>Пульт<span class="sidebar-brand-accent">.</span>Планировщик</span>
        </div>
        <h2>Вход в систему</h2>
        {% if error_message %}
        <div class="flash-message">
            <p>{{ error_message }}</p>
        </div>
        {% endif %}
        <form method="POST" action="/login">
            <div class="form-group">
                <label for="employee_id">Сотрудник:</label>
                <select id="employee_id" name="employee_id" required>
                    <option value="">— выберите —</option>
                    {% for emp in employees %}
                    <option value="{{ emp.id }}">{{ emp.last_name }} {{ emp.first_name }}{% if emp.middle_name %} {{ emp.middle_name }}{% endif %}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Войти</button>
        </form>
    </div>
</div>
<script src="/static/js/script.js"></script>
</body>
</html>
