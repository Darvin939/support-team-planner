<!DOCTYPE html>
<html lang="ru" data-theme="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Планировщик работ{% endblock %}</title>
    <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app-shell">
    <button type="button" class="sidebar-burger" id="sidebarBurger" aria-label="Меню" aria-expanded="false">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 5.5h14M3 10h14M3 14.5h14"/></svg>
    </button>
    <div class="sidebar-scrim" id="sidebarScrim"></div>
    <aside class="sidebar" id="sidebar">
        <a href="/planning" class="sidebar-brand">
            <span class="sidebar-brand-mark" aria-hidden="true">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="14" height="14" rx="3"/><path d="M3 8.5h14M8.2 3v14"/></svg>
            </span>
            <span class="sidebar-brand-text">Пульт<span class="sidebar-brand-accent">.</span>Планировщик</span>
        </a>

        <nav class="sidebar-nav">
            <a href="/planning" class="sidebar-link{% if request.url.path.startswith('/planning') %} active{% endif %}">
                <span class="sidebar-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="14" height="13" rx="2"/><path d="M3 8h14M7 4v13"/></svg></span>
                <span class="sidebar-label">Планирование</span>
            </a>
            <a href="/statistics" class="sidebar-link{% if request.url.path.startswith('/statistics') %} active{% endif %}">
                <span class="sidebar-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16.5V10M10 16.5V3.5M16 16.5v-6"/></svg></span>
                <span class="sidebar-label">Статистика</span>
            </a>
            <a href="/journal" class="sidebar-link{% if request.url.path.startswith('/journal') %} active{% endif %}">
                <span class="sidebar-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10.5" r="6.5"/><path d="M10 7v3.5l2.4 1.4"/></svg></span>
                <span class="sidebar-label">Журнал изменений</span>
            </a>
            {% if current_role is defined and current_role in ('admin', 'editor') %}
            <a href="/settings" class="sidebar-link{% if request.url.path.startswith('/settings') %} active{% endif %}">
                <span class="sidebar-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="2.6"/><path d="M10 3.6v1.6M10 14.8v1.6M16.4 10h-1.6M5.2 10H3.6M14.5 5.5l-1.1 1.1M6.6 13.3l-1.1 1.1M14.5 14.5l-1.1-1.1M6.6 6.7 5.5 5.6"/></svg></span>
                <span class="sidebar-label">Настройки</span>
            </a>
            {% endif %}
        </nav>

        <div class="sidebar-footer">
            <button id="themeToggle" class="sidebar-theme-toggle" title="Светлая / тёмная тема" type="button">
                <span class="sidebar-icon theme-icon-moon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 12.4A6.8 6.8 0 0 1 7.6 3.5a6.8 6.8 0 1 0 8.9 8.9Z"/></svg></span>
                <span class="sidebar-icon theme-icon-sun"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="3.6"/><path d="M10 2.8v1.8M10 15.4v1.8M17.2 10h-1.8M4.6 10H2.8M14.9 5.1l-1.3 1.3M6.4 13.6l-1.3 1.3M14.9 14.9l-1.3-1.3M6.4 6.4 5.1 5.1"/></svg></span>
                <span class="sidebar-label theme-toggle-label">Тема</span>
            </button>
            <a href="#" class="sidebar-link sidebar-logout" onclick="fetch('/logout',{method:'POST'}).then(()=>location.href='/login');return false;">
                <span class="sidebar-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.5H4.8A1.3 1.3 0 0 0 3.5 4.8v10.4a1.3 1.3 0 0 0 1.3 1.3H8"/><path d="M13 13.5l3.5-3.5L13 6.5M7.5 10h9"/></svg></span>
                <span class="sidebar-label">Выйти</span>
            </a>
        </div>
    </aside>

    <div class="app-main">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </div>
</div>

<script src="/static/js/script.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
